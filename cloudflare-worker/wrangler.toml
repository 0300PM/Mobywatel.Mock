#:schema node_modules/wrangler/config-schema.json
name = "mobywatels-workers-ai"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Domyślny model, gdy aplikacja nie poda własnego.
[vars]
DEFAULT_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

# Wariant bez tokenu API: worker woła Workers AI przez wiązanie AI.
# Jeśli wolisz klucz konta (CLOUDFLARE_API_TOKEN), usuń poniższe wiązanie.
[ai]
binding = "AI"

# Sekrety ustawia się komendą: wrangler secret put WORKER_TOKEN
# (oraz CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN, jeśli używasz wariantu z tokenem).
