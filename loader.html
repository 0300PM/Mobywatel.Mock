<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
   <style>
       *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body{
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}
.container{
    width: 400px;
    height: 200px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}
.container p{
    text-align: center;
    padding: 10px 0;
}
.animated{
    width: 100%;
    height: 100vh;
    z-index: 10;
    background: white;
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;

}
.circle{
    width: 300px;
    height: 300px;
    background: rgb(94, 189, 221);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: animate 1s infinite;
}
@keyframes animate{
    from{
        height: 0px;
        width: 0px;
    }
    to{
        height: 300px;
        width: 300px;
    }
}
.innercircle{
    width: 200px;
    height: 200px;
    background: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}
#flex{
    display: flex;
}
h1{
    font-weight: 800;
    font-family: sans-serif;
    font-size: 41px;
    color: rgb(3, 61, 61);
}
   </style>
</head>
<body>
    <div class="animated">
        <div class="circle">
            <div class="innercircle">
                <div id="flex"><h1 id="number">0</h1><h1>%</h1></div>
            </div>
        </div>
    </div>
</body>

<script>
    const number = document.getElementById('number');
const animated = document.querySelector('.animated');
let counter = 1;
function increase(){
    number.innerHTML = counter;
    counter++;
}
setInterval(increase,50);

function hide(){
    animated.style.display = 'none';
}
setTimeout(hide,5080);
</script>
</html>
